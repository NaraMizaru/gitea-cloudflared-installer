services:
  runner-windows-vm:
    image: dockurr/windows:latest
    container_name: ${WINDOWS_RUNNER_NAME:-gitea-runner-windows-vm}
    restart: unless-stopped
    stop_grace_period: 2m
    devices:
      - /dev/kvm
    cap_add:
      - NET_ADMIN
    ports:
      - "${WINDOWS_VM_VNC_PORT:-127.0.0.1:8006}:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
    environment:
      VERSION: "${WINDOWS_VM_VERSION:-2022}"
      RAM_SIZE: "${WINDOWS_VM_RAM_SIZE:-4G}"
      CPU_CORES: "${WINDOWS_VM_CPU_CORES:-2}"
      DISK_SIZE: "${WINDOWS_VM_DISK_SIZE:-64G}"
      GITEA_INSTANCE_URL: "${GITEA_INSTANCE_URL}"
      GITEA_RUNNER_NAME: "${WINDOWS_RUNNER_NAME:-gitea-runner-windows-vm}"
      GITEA_RUNNER_REGISTRATION_TOKEN: "${WINDOWS_RUNNER_TOKEN:-${RUNNER_TOKEN}}"
      GITEA_RUNNER_LABELS: "${WINDOWS_RUNNER_LABELS:-windows:host,windows-msbuild:host,windows-latest:host}"
    volumes:
      - ${DATA_DIR:-/srv/data}/runner-windows-vm:/storage
      - ./oem:/oem

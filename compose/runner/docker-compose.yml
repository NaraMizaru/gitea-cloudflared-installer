services:
  runner-linux:
    image: docker.io/gitea/runner:latest
    container_name: ${LINUX_RUNNER_NAME:-gitea-runner-linux}
    restart: unless-stopped
    environment:
      GITEA_INSTANCE_URL: ${GITEA_INSTANCE_URL}
      GITEA_RUNNER_NAME: ${LINUX_RUNNER_NAME:-gitea-runner-linux}
      GITEA_RUNNER_REGISTRATION_TOKEN: ${LINUX_RUNNER_TOKEN:-${RUNNER_TOKEN}}
      CONFIG_FILE: /config.yaml
    volumes:
      - ${DATA_DIR}/runner-linux:/data
      - ${DATA_DIR}/runner-linux/config.yaml:/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - git-network
    profiles:
      - linux
      - both

  runner-windows-vm:
    image: dockurr/windows:latest
    container_name: ${WINDOWS_RUNNER_NAME:-gitea-runner-windows-vm}
    restart: unless-stopped
    devices:
      - /dev/kvm
    cap_add:
      - NET_ADMIN
    ports:
      - "${WINDOWS_VM_VNC_PORT:-127.0.0.1:8006}:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
    environment:
      VERSION: "${WINDOWS_VM_VERSION:-2022}"
      RAM_SIZE: "${WINDOWS_VM_RAM_SIZE:-4G}"
      CPU_CORES: "${WINDOWS_VM_CPU_CORES:-2}"
      DISK_SIZE: "${WINDOWS_VM_DISK_SIZE:-64G}"
      GITEA_INSTANCE_URL: "${GITEA_INSTANCE_URL}"
      GITEA_RUNNER_NAME: "${WINDOWS_RUNNER_NAME:-gitea-runner-windows-vm}"
      GITEA_RUNNER_REGISTRATION_TOKEN: "${WINDOWS_RUNNER_TOKEN:-${RUNNER_TOKEN}}"
      GITEA_RUNNER_LABELS: "${WINDOWS_RUNNER_LABELS:-windows:host,windows-msbuild:host,windows-latest:host}"
    volumes:
      - ${DATA_DIR}/runner-windows-vm:/storage
      - ./oem:/oem
    profiles:
      - windows
      - both

networks:
  git-network:
    name: ${DOCKER_NETWORK}
    external: true
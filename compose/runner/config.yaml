log:
  level: "info"

runner:
  file: "/data/.runner"
  capacity: 1
  timeout: "3h"
  insecure: false
  fetch_interval: "2s"
  labels:
    - "ubuntu-latest:docker://gitea/runner-images:ubuntu-latest"

cache:
  enabled: true
  dir: "/tmp/cache"

container:
  # job container akan masuk network yang sama dengan gitea
  network: "git-network"

  # tidak perlu DinD
  privileged: false
  valid_volumes:
    - "/var/run/docker.sock:/var/run/docker.sock"

host:
  workdir_parent: "/tmp/act"